<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #fe2c55; /* Couleur rouge TikTok */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--accent-color);
            margin-bottom: 15px;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
        }
        p {
            font-size: 14px;
            color: #aaa;
            margin: 0 0 30px 0;
        }
        .links-container {
            width: 100%;
            max-width: 400px;
        }
        .link-card {
            display: block;
            background-color: var(--card-color);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid #333;
            transition: transform 0.2s, border-color 0.2s;
        }
        .link-card:hover {
            transform: scale(1.02);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- Votre Logo ou Avatar Anonyme -->
    <div class="profile-img"></div>

    <h1>@VotreNomTikTok</h1>
    <p>Sviluppatore Web | Contattami qui sotto</p>

    <div class="links-container">
        <!-- Lien WhatsApp Direct -->
        <!-- Remplissez avec votre numéro au format international (ex: 33600000000 sans le +) -->
        <a href="https://wa.me" class="link-card" target="_blank">💬 Chat su WhatsApp</a>

        <!-- Lien Telegram Direct -->
        <!-- Remplissez avec votre @username Telegram (sans le @) -->
        <a href="https://t.me" class="link-card" target="_blank">✈️ Canale Telegram</a>

        <!-- Lien E-mail Direct -->
        <a href="mailto:votre-email-anonyme@proton.me" class="link-card">✉️ Invia un'E-mail</a>
    </div>

</body>
</html>
